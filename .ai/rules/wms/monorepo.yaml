rules:
  - id: WMS-ARCH-001
    statement: Frontend (apps/web) must consume API contracts from packages/shared and must not directly connect to the database.
    control: enforcement
    severity: blocking
    action: BLOCK

  - id: WMS-SEC-001
    statement: User passwords must be hashed and never exposed in API DTO responses.
    control: enforcement
    severity: blocking
    action: BLOCK

  - id: WMS-DATA-001
    statement: Every task must be bound to a facility and have a defined assignment target.
    control: enforcement
    severity: blocking
    action: BLOCK
