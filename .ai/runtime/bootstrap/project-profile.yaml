project:
  type: monorepo
  package_manager: pnpm
stacks:
  frontend:
    framework: react
    root: apps/web
  backend:
    framework: nestjs
    root: apps/api
  other:
  - framework: node
    root: packages/shared
  - framework: node
    root: .
datastores:
- postgres
tooling:
  docker: false
  compose: true
  turbo: false
  nx: false
commands:
  install: pnpm install --frozen-lockfile
  build: pnpm build
  lint: pnpm lint
  typecheck: pnpm typecheck
  test: pnpm test
  contract_test: pnpm test:contract
  architecture_test: pnpm test:architecture
  ui_test: pnpm test:ui
