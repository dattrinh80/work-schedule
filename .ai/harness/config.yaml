version: 4.0.0
mode: controlled-autonomous
execution:
  parallel_workers: 3
  repair_max_attempts: 5
  no_progress_limit: 2
  checkpoint_after_blocking_gate: true
runtime:
  default: generic
  dry_run_by_default: true
  default_timeout_seconds: 1800
  max_timeout_seconds: 7200
git:
  isolation: true
  branch_prefix: ai
  worktree_root: ../.ai-worktrees
  integration_branch: main
  conflict_policy: BLOCK
approvals:
  required_for:
  - production_deploy
  - destructive_migration
  - public_api_breaking_change
  - auth_architecture_change
  - secrets_change
  - permissions_change
  - sensitive_data_transfer
completion:
  require_evidence: true
  require_all_blocking_gates_passed: true
