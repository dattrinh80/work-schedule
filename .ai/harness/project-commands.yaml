commands:
  install: 'pnpm install --ignore-scripts'
  build: 'pnpm run build'
  lint: 'pnpm run lint'
  typecheck: 'pnpm run typecheck'
  test: 'pnpm run test'
  contract_test: 'node scripts/contract-check.mjs'
  architecture_test: 'node scripts/architecture-check.mjs'
  ui_test: 'pnpm --filter @wms/web run test'
  security_test: 'node scripts/security-check.mjs'
  database_test: 'pnpm --filter @wms/api run test'
