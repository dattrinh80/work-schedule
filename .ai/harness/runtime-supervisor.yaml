runtime_supervisor:
  default_runtime: generic
  default_timeout_seconds: 1800
  max_timeout_seconds: 7200
  dry_run_by_default: true
  capture_stdout: true
  capture_stderr: true
  include_environment_in_logs: false
  auto_retry_process_failure: false

runtimes:
  generic:
    command: ""
  codex:
    command: "codex exec --sandbox workspace-write --ask-for-approval never -"
  claude-code:
    command: "claude -p --permission-mode default --output-format json"
    max_turns: 12
